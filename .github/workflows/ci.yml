name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read  # minimum GITHUB_TOKEN permissions (spec 18.3)

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: MyPy
        run: mypy app
      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml -m "not cloud"
      - name: pip-audit
        run: pip-audit -r requirements.txt

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # TODO Phase 4: pin to a commit SHA (spec 18.3)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run semgrep scan --config auto --error

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t steg-app:ci .
      # TODO Phase 4: Trivy filesystem + container scans
